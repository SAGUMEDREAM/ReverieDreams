plugins {
    id 'multiloader-common'
    alias libs.plugins.modDevGradle
}

neoForge {
    neoFormVersion = "26.1.2-1"
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    compileOnly("org.spongepowered:mixin:${mixin_version}")
}

apply from: rootProject.file('repositories.gradle')
dependencies {
    implementation("dev.architectury:architectury:${architectury_api_version}")
    implementation("gg.moonflower:molang-compiler:3.1.1.19")
    implementation("com.geckolib:geckolib-common-${minecraft_version}:${geckolib_version}")
    compileOnly("com.klikli_dev:modonomicon-${minecraft_version}-common:${modonomicon_version}") { transitive = false }

    api("cc.thonly:sgui-common:${sgui_forgelike_version}")
    api("cc.thonly:keine-common:${keine_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-common:${jei_version}")
    compileOnly("cc.cassian.rrv:reliable-recipe-viewer-fabric:${rrv_version}+${minecraft_version}")
    compileOnly("cc.cassian.rrv:reliable-recipe-viewer-neoforge:${rrv_version}+${minecraft_version}")

//    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}")

    implementation("com.fasterxml.jackson.core:jackson-databind:2.18.3")
    implementation("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.3")
    compileOnly("me.shedaniel:RoughlyEnoughItems-api:${rei_version}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin:${rei_version}")
}


configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
    commonGeneratedResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

sourceSets {
    generated {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
    commonGeneratedResources sourceSets.generated.resources.sourceDirectories.singleFile
}
