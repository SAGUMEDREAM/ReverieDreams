tasks.register("curseforge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = "upload"
    description = "Uploads the Fabric jar to CurseForge"

    apiToken = System.getenv("CURSEFORGE_API_KEY") ?: "unset"

    def mainFile = upload(curseforge_project_id, tasks.named("jar"))
    mainFile.changelog = rootProject.file('./CHANGELOG_RECENT.md')
    mainFile.changelogType = "markdown"
    mainFile.releaseType = "${project.version_type}" // Options: release, beta, alpha
    mainFile.addGameVersion "${minecraft_version}"
    mainFile.addModLoader "Fabric"
    mainFile.addRequirement "fabric-api"
    mainFile.addRequirement "architectury-api"
    mainFile.addOptional "jei"
    mainFile.addOptional "roughly-enough-items"
    mainFile.addOptional "rrv"
    mainFile.addOptional "jade"
    mainFile.addOptional "appleskin"
    mainFile.addOptional "farmers-delight-refabricated"
    mainFile.addOptional "kaleidoscope-cookery-refabricated"
    mainFile.addOptional "more-delight-fabric"
}

loom {
    def aw = project(":common").file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

//    mixin {
//        defaultRefmapName.set("${mod_id}.refmap.json")
//    }

    runs {
        client {
            client()
            setConfigName("fabric Client")
            ideConfigGenerated(true)
            programArgs(["--username", "Dev"])
            // Sparkle 2.3.2 also ships IrisApi; the real Iris API must take precedence in dev.
            vmArg "-Dfabric.debug.loadLate=sparkle_morpher"
            runDir("runs")
        }
        clientPolymer {
            client()
            setConfigName("fabric Client (mod + polymer)")
            ideConfigGenerated(true)
            programArgs(["--username", "Dev"])
            runDir("runs/polymer-client")
        }
        server {
            server()
            setConfigName("fabric Server")
            ideConfigGenerated(true)
            runDir("runs")
        }
        data {
            inherit client
            setConfigName("fabric Data")
            ideConfigGenerated(true)
            runDir("build/datagen")

            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${project(":common").file("src/generated/resources")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
        }
    }
}

// Combined dev client: main Fabric mod (this project) + the Polymer patch jar.
def polymerClientMods = layout.projectDirectory.dir("runs/polymer-client/mods")
tasks.register("syncPolymerClientMod", Copy) {
    dependsOn(":polymer:jar")
    from(project(":polymer").tasks.named("jar").flatMap { it.archiveFile })
    into(polymerClientMods)
    rename { "reverie_dreams_polymerify-dev.jar" }
    doFirst {
        delete(fileTree(dir: polymerClientMods, include: "reverie_dreams_polymerify*.jar"))
    }
}
tasks.named("runClientPolymer") {
    dependsOn("syncPolymerClientMod")
}


def includeDependencyJar = { File targetJar, List<String> list ->

    def tempDir = new File(buildDir, "tmp/include_jars")
    tempDir.deleteDir()
    tempDir.mkdirs()

    // 解压目标 mod jar
    copy {
        from zipTree(targetJar)
        into tempDir
    }

    // 创建 META-INF/jars 目录
    def metaDir = new File(tempDir, "META-INF/jars")
    metaDir.mkdirs()

    // 复制依赖 jar
    list.each { fil ->
        copy {
            from file(fil)
            into metaDir
        }
    }

    // 修改 fabric.mod.json
    def jsonFile = new File(tempDir, "fabric.mod.json")
    if (jsonFile.exists()) {
        def json = new JsonSlurper().parseText(jsonFile.text)
        if (!json.containsKey("jars")) {
            json.jars = []
        }

        list.each { fil ->
            def jarName = "META-INF/jars/${new File(fil).name}"
            // 避免重复写入
            if (!json.jars.any { it.file == jarName }) {
                json.jars << [file: jarName]
            }
        }

        jsonFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(json))
    } else {
        throw new GradleException("fabric.mod.json not found in ${targetJar}")
    }

    // 重新打包 mod jar
    ant.jar(destfile: targetJar) {
        fileset(dir: tempDir, includes: "**/*")
    }

    tempDir.deleteDir()
}

