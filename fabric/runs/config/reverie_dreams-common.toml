
# Enable Update Checker
# If enabled, the mod will automatically check for new versions.
checkUpdate = false

# Configuration File Version (Do not modify)
configVersion = 1

# Enable Debug Mode
# Shows extra debug logs and developer-only information.
debugMode = false

# Enable Glow Effect for Danmaku Items
# Replaces vanilla torch item overlay to display a glowing outline.
enableDanmakuGlow = true

# Enable Ghost Spawning
# Toggle to allow Ghosts to spawn naturally.
enableGhostSpawn = false

# Enable Yousei Spawning
# Toggle to allow Yousei to spawn naturally.
enableYouseiSpawn = true

# Maximum Upgraded Health
# Defines the highest total health value players can reach through upgrades.
maxUpgradedHealthValue = 1024

