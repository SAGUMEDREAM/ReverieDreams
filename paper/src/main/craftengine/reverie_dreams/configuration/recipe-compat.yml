# Four bricks already craft into one vanilla bricks block. Preserve both source
# recipes and provide the same four-brick material cost through a stonecutter.
recipes:
  reverie_dreams:compat/kawara_tiles_from_bricks:
    type: stonecutting
    ingredients: minecraft:bricks
    result:
      id: reverie_dreams:kawara_tiles
      count: 4
  reverie_dreams:compat/yotsume_gaki_from_oak_fence:
    type: shapeless
    ingredients:
      - minecraft:oak_fence
    result:
      id: reverie_dreams:yotsume_gaki
      count: 1
  # Six curtain colors share the exact source wool-and-string pattern with the
  # same-color cushion (white also with the base cushion), so only one
  # registration per wool color can win crafting. Preserve every source recipe
  # and expose each shadowed result at the same material cost via the
  # stonecutter, which supports several deterministic outputs for one input.
  reverie_dreams:compat/noren_white_from_zabuton:
