blocks:
  reverie_dreams:spiritual_leaves:
    settings:
      item: reverie_dreams:spiritual_leaves
      hardness: 0.2
      resistance: 0.2
      can_occlude: false
      is_suffocating: false
      is_redstone_conductor: false
      push_reaction: destroy
      sounds:
        break: minecraft:block.grass.break
        fall: minecraft:block.grass.fall
        hit: minecraft:block.grass.hit
        place: minecraft:block.grass.place
        step: minecraft:block.grass.step
      tags:
      - minecraft:leaves
      - minecraft:mineable/axe
      - minecraft:replaceable_by_trees
      is_randomly_ticking: true
      burnable: true
      burn_chance: 30
      fire_spread_chance: 60
      light_block: 1
    behavior:
      type: leaves_block
    state:
      properties:
        distance:
          type: int
          min: 1
          max: 7
          default: 7
        persistent:
          type: boolean
          default: true
        waterlogged:
          type: boolean
          default: false
      appearances:
        dry:
          auto_state: non_tintable_leaves
          model:
            path: reverie_dreams:block/plants/spiritual_leaves_world
        wet:
          auto_state: waterlogged_non_tintable_leaves
          model:
            path: reverie_dreams:block/plants/spiritual_leaves_world
      variants:
        waterlogged=false:
          appearance: dry
        waterlogged=true:
          appearance: wet
          settings:
            fluid_state: water
            resistance: 1200.0
            burnable: false
    loot:
      pools:
      - rolls: 1
        entries:
        - type: alternatives
          children:
          - type: item
            item: reverie_dreams:spiritual_leaves
            conditions:
            - type: any_of
              terms:
              - type: match_item
                id: minecraft:shears
              - type: enchantment
                predicate: minecraft:silk_touch>=1
          - type: item
            item: reverie_dreams:spiritual_sapling
            conditions:
            - type: survives_explosion
            - type: table_bonus
              enchantment: minecraft:fortune
              chances:
              - 0.05
              - 0.0625
              - 0.083333336
              - 0.1
      - rolls: 1
        conditions:
        - type: inverted
          term:
            type: any_of
            terms:
            - type: match_item
              id: minecraft:shears
            - type: enchantment
              predicate: minecraft:silk_touch>=1
        entries:
        - type: item
          item: minecraft:stick
          conditions:
          - type: table_bonus
            enchantment: minecraft:fortune
            chances:
            - 0.02
            - 0.022222223
            - 0.025
            - 0.033333335
            - 0.1
          functions:
          - type: set_count
            count:
