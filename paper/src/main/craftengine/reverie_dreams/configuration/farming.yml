    settings:
      item: reverie_dreams:paddy_field
      hardness: 0.6
      resistance: 0.6
      is_suffocating: true
      is_view_blocking: true
      is_redstone_conductor: false
      use_shape_for_light_occlusion: true
      is_randomly_ticking: true
      can_occlude: true
      sounds:
        break: minecraft:block.gravel.break
        fall: minecraft:block.gravel.fall
        hit: minecraft:block.gravel.hit
        place: minecraft:block.gravel.place
        step: minecraft:block.gravel.step
    behavior:
      type: reverie_dreams:paddy_field
    state:
      properties:
        moisture:
          type: int
          min: 0
          max: 7
          default: 7
      appearances:
        moist:
          state: minecraft:farmland[moisture=7]
    loot:
      pools:
      - rolls: 1
        entries:
        - type: item
          item: minecraft:dirt
        conditions:
        - type: survives_explosion
