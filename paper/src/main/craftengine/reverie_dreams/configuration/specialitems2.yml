        minecraft:max_stack_size: 1
    model:
      type: minecraft:model
      model: reverie_dreams:item/cheque
    behavior:
      type: reverie_dreams:special_item_expansion
  reverie_dreams:treasure_hunting_rod:
    material: paper
    data:
      item_name: <!i><lang:item.reverie_dreams.treasure_hunting_rod>
