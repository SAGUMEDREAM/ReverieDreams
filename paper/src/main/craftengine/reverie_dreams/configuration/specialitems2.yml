        minecraft:max_stack_size: 1
        minecraft:max_damage: 300
        minecraft:damage: 0
        minecraft:enchantable:
          value: 5
        minecraft:repairable:
          items: '#minecraft:diamond_tool_materials'
        minecraft:attribute_modifiers:
        - type: minecraft:attack_damage
          id: minecraft:base_attack_damage
          amount: 6.5
          operation: add_value
          slot: mainhand
        - type: minecraft:attack_speed
          id: minecraft:base_attack_speed
          amount: -2.799999952316284
          operation: add_value
          slot: mainhand
        minecraft:weapon:
          item_damage_per_attack: 1
          disable_blocking_for_seconds: 0
        minecraft:tool:
          rules:
          - blocks:
            - minecraft:cobweb
            speed: 15
            correct_for_drops: true
          - blocks: '#minecraft:sword_instantly_mines'
            speed: 3.4028235e+38
          - blocks: '#minecraft:sword_efficient'
            speed: 1.5
          default_mining_speed: 1
          damage_per_block: 2
          can_destroy_blocks_in_creative: false
        minecraft:use_cooldown:
          seconds: 0.05
          cooldown_group: reverie_dreams:special2/treasure_hunting_rod
    model:
      type: minecraft:model
      model: reverie_dreams:item/treasure_hunting_rod
    behavior:
      type: reverie_dreams:special_item_expansion
    settings:
      respect_repairable_component: true
      enchantable: true
      tags:
      - minecraft:swords
