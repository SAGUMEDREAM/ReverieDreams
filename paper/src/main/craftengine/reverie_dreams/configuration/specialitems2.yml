    material: paper
    data:
      item_name: <!i><lang:item.reverie_dreams.upgraded_health>
    model:
      type: minecraft:model
      model: reverie_dreams:item/upgraded_health
    behavior:
      type: reverie_dreams:special_item_expansion
  reverie_dreams:bomb:
