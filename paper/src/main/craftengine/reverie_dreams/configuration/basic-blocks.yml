blocks:
  reverie_dreams:black_salt_block:
    settings:
      item: reverie_dreams:black_salt_block
      hardness: 0.5
      resistance: 0.5
      sounds:
        break: minecraft:block.sand.break
        fall: minecraft:block.sand.fall
        hit: minecraft:block.sand.hit
        place: minecraft:block.sand.place
        step: minecraft:block.sand.step
    state:
      auto_state: solid
      model:
        path: reverie_dreams:block/black_salt_block
    loot:
      pools:
      - rolls: 1
        conditions:
        - type: survives_explosion
