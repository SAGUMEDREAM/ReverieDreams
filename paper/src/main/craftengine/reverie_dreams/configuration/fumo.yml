# CraftEngine26.8.2 native furniture; original Fumo models, collision-free targeting and server-selected sounds.
items:
  reverie_dreams:fumo/alice:
    material: paper
    settings:
      tags:
      - reverie_dreams:fumo
    data:
      item_name: <!i><lang:block.reverie_dreams.fumo.alice>
    model: reverie_dreams:block/fumo/alice
    behavior:
      type: furniture_item
      rules:
        ground:
          rotation: sixteen
          alignment: center
      furniture:
        settings:
          item: reverie_dreams:fumo/alice
          hit_times: 3
          sounds:
            break: minecraft:block.wool.break
            place:
              id: minecraft:block.wool.place
              volume: 0.5
              pitch: 1
            hit: minecraft:block.wool.hit
        events:
        - 'on': right_click
          functions:
          - type: if_else
            rules:
            - conditions:
              - type: random
                value: 0.3333333333333333
              functions:
              - type: play_sound
                sound: reverie_dreams:fumo/0
                source: BLOCK
                volume: 1
                pitch: 1
            - conditions:
              - type: random
                value: 0.5
              functions:
              - type: play_sound
                sound: reverie_dreams:fumo/1
                source: BLOCK
                volume: 1
                pitch: 1
            - functions:
              - type: play_sound
                sound: reverie_dreams:fumo/2
                source: BLOCK
                volume: 1
                pitch: 1
          - type: update_interaction_tick
          - type: cancel_event
        variants:
          ground:
            loot_spawn_offset: 0,0.3,0
            elements:
            - item: reverie_dreams:fumo/alice
              display_transform: NONE
              translation: 0,0.5,0
            hitboxes:
            - type: interaction
              position: 0,0,0
              invisible: true
              width: 0.625
              height: 0.625
              interactive: true
              blocks_building: true
              can_be_hit_by_projectile: false
        loot:
          template: default:loot_table/furniture
          arguments:
            item: reverie_dreams:fumo/alice
