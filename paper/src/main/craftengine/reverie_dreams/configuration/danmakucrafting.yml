# CE26.8.2 native dye recipes plus source crafting/strength stations. No combat parameters changed.
items:
  reverie_dreams:danmaku_crafting_table:
    material: paper
    data:
      item_name: <!i><lang:block.reverie_dreams.danmaku_crafting_table>
    model: reverie_dreams:block/danmaku_crafting_table
    behavior:
      type: block_item
      block: reverie_dreams:danmaku_crafting_table
  reverie_dreams:strength_table:
    material: paper
    data:
      item_name: <!i><lang:block.reverie_dreams.strength_table>
    model: reverie_dreams:block/strength_table
    behavior:
      type: block_item
      block: reverie_dreams:strength_table
  reverie_dreams:danmaku_core:
    material: paper
    data:
      item_name: <!i><lang:item.reverie_dreams.danmaku_core>
      components:
        minecraft:enchantment_glint_override: true
    model: reverie_dreams:item/danmaku_core
  reverie_dreams:danmaku_recipe_creator:
    material: paper
    data:
      item_name: <!i><lang:item.reverie_dreams.danmaku_recipe_creator>
      components:
        minecraft:max_stack_size: 4
    model: reverie_dreams:item/danmaku_recipe_creator
    behavior:
      type: reverie_dreams:danmaku_shape_creator
  reverie_dreams:spell_card_template:
    material: paper
    data:
      item_name: <!i><lang:item.reverie_dreams.spell_card_template>
    model: reverie_dreams:item/spell_card_template
  reverie_dreams:speed_feather:
    material: paper
    data:
      item_name: <!i><lang:item.reverie_dreams.speed_feather>
      components:
        minecraft:enchantment_glint_override: true
    model: reverie_dreams:item/speed_feather
blocks:
  reverie_dreams:danmaku_crafting_table:
    settings:
      item: reverie_dreams:danmaku_crafting_table
      hardness: 2.5
      resistance: 2.5
      push_reaction: block
      sounds:
        break: minecraft:block.wood.break
        fall: minecraft:block.wood.fall
        hit: minecraft:block.wood.hit
        place: minecraft:block.wood.place
        step: minecraft:block.wood.step
    behavior:
      type: reverie_dreams:danmaku_table
      kind: CRAFTING
    state:
      state: minecraft:crafting_table
      entity_renderer:
        item: reverie_dreams:danmaku_crafting_table
        display_transform: NONE
        scale: 1.005
    loot:
      pools:
      - rolls: 1
        entries:
        - type: item
          item: reverie_dreams:danmaku_crafting_table
        conditions:
        - type: survives_explosion
  reverie_dreams:strength_table:
    settings:
      item: reverie_dreams:strength_table
      hardness: 2.5
      resistance: 2.5
      push_reaction: block
      sounds:
        break: minecraft:block.wood.break
        fall: minecraft:block.wood.fall
        hit: minecraft:block.wood.hit
        place: minecraft:block.wood.place
        step: minecraft:block.wood.step
    behavior:
      type: reverie_dreams:danmaku_table
      kind: STRENGTH
    state:
      state: minecraft:smithing_table
      entity_renderer:
        item: reverie_dreams:strength_table
        display_transform: NONE
        scale: 1.005
    loot:
      pools:
      - rolls: 1
        entries:
        - type: item
          item: reverie_dreams:strength_table
        conditions:
        - type: survives_explosion
recipes:
  reverie_dreams:danmaku_crafting_table:
    type: shaped
    pattern:
    - XXX
    - X#X
    - XXX
    ingredients:
      '#': minecraft:crafting_table
      X: minecraft:redstone
    result:
      id: reverie_dreams:danmaku_crafting_table
      count: 1
  reverie_dreams:strength_table:
    type: shaped
    pattern:
    - XXX
    - X#X
    - XXX
    ingredients:
      '#': minecraft:enchanting_table
      X: reverie_dreams:silver_ingot
    result:
      id: reverie_dreams:strength_table
      count: 1
  reverie_dreams:danmaku_core:
    type: shaped
    pattern:
    - XXX
    - X#X
    - XXX
    ingredients:
      '#': minecraft:firework_star
      X: minecraft:iron_nugget
    result:
      id: reverie_dreams:danmaku_core
      count: 1
  reverie_dreams:danmaku_recipe_creator:
    type: shaped
    pattern:
    - RRR
    - R#R
    - RRR
    ingredients:
      '#': minecraft:writable_book
      R: reverie_dreams:power
    result:
      id: reverie_dreams:danmaku_recipe_creator
      count: 1
  reverie_dreams:speed_feather:
    type: shaped
    pattern:
    - XXX
    - X#X
    - XXX
    ingredients:
      '#': minecraft:diamond
      X: minecraft:feather
    result:
      id: reverie_dreams:speed_feather
      count: 1
