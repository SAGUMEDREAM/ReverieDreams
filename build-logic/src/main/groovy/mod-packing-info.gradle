enum RemapJarType {
    RELEASE(""),
    BETA("beta"),
    ALPHA("alpha"),
    ;
    public final String name;

    RemapJarType(String name) {
        this.name = name
    }
}

def isLts = false
def remapJarType = RemapJarType.valueOf(project.version_type.toUpperCase())

base {
    project.jar.archiveVersion = ""
    def name =  "%s-%s+%s%s%s".formatted(
            mod_id,
            project.name == "polymer" ? "fabric+polymerify" : project.name,
            version,
            (remapJarType == RemapJarType.RELEASE ? "" : "+" + remapJarType.name),
            (isLts ? "+lts" : "")
    )
    archivesName = name
}