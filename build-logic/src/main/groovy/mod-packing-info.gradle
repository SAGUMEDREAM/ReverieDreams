enum RemapJarType {
    STABLE(""),
    BETA("beta"),
    ALPHA("alpha"),
    ;
    public final String name;

    RemapJarType(String name) {
        this.name = name
    }
}

def isLts = false
def remapJarType = RemapJarType.BETA

base {
    def name =  "%s-%s+%s%s%s".formatted(
            mod_id,
            project.name == "polymer" ? "fabric+polymerify" : project.name,
            version,
            (remapJarType == RemapJarType.STABLE ? "" : "+" + remapJarType.name),
            (isLts ? "+lts" : "")
    )
    archivesName = name
}